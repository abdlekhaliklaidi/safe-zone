<div class="min-h-screen bg-[#0a1120] p-6 sm:p-12 antialiased font-sans">
  <div class="max-w-7xl mx-auto">

    <!-- Header Section -->
    <div
      class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-8 border-b border-white/10 gap-4 mb-10">
      <div>
        <h1 class="text-3xl font-black text-white tracking-tight uppercase">
          Market Catalog
        </h1>
        <p class="text-xs font-mono text-gray-400 mt-1 uppercase tracking-widest">
          Browse digital component offerings and artisan tools
        </p>
      </div>

      <!-- Button shown ONLY to Sellers/Admins -->
      <a *ngIf="canAddProduct" routerLink="/products/add"
        class="bg-white hover:bg-gray-100 text-[#001830] font-bold text-xs uppercase tracking-widest px-6 py-3.5 rounded-lg transition shadow-md flex items-center gap-2">
        Add New Product
      </a>
    </div>

    <!-- Loading Skeleton Placeholder -->
    <div *ngIf="isLoading" class="text-center py-20">
      <div class="inline-block animate-pulse text-white text-lg font-mono uppercase tracking-widest">
        Fetching Marketplace Registry...
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && products.length === 0"
      class="bg-white/5 border border-white/10 rounded-2xl p-16 text-center max-w-lg mx-auto">
      <div class="text-4xl mb-4">📦</div>
      <h3 class="text-xl font-bold text-white uppercase tracking-wider">No Products Found</h3>
      <p class="text-sm text-gray-400 mt-2">There are currently no items in the store index.</p>
    </div>

    <!-- Product Grid -->
    <!-- ✅ CORRECT: Standard open tag with matching closing tag -->
    <div *ngIf="!isLoading && products.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of products" [product]="product" [currentUserId]="authService.getUserId()"
        [currentUserRole]="authService.getRole()" (delete)="onDeleteProduct($event)">
      </app-product-card>
    </div>

  </div>
</div>
